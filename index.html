<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&I Antojitos - Menú</title>
    <style>
        :root { --rosa: #d81b60; --fondo: #fce4ec; }
        body { font-family: sans-serif; background-color: var(--fondo); margin: 0; text-align: center; color: #333; }
        header { background: var(--rosa); color: white; padding: 25px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { background: white; margin: 20px 15px; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: var(--rosa); border-bottom: 2px solid var(--fondo); padding-bottom: 10px; margin-top: 0; }
        .item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 1.1rem; }
        .price { font-weight: bold; color: var(--rosa); }
        .btn { background: #25d366; color: white; padding: 18px; width: 85%; border-radius: 50px; text-decoration: none; font-weight: bold; display: inline-block; margin: 25px 0; font-size: 1.2rem; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3); }
    </style>
</head>
<body>
    <header><h1>M&I ANTOJITOS</h1><p>¡Los mejores bolis de Coapa! 🧊✨</p></header>
    <div class="card">
        <h2>Bolis de Leche ($25)</h2>
        <div class="item"><span>Piña Colada</span><span class="price">$25</span></div>
        <div class="item"><span>Mazapán</span><span class="price">$25</span></div>
        <div class="item"><span>Oreo</span><span class="price">$25</span></div>
        <div class="item"><span>Duvalín</span><span class="price">$25</span></div>
    </div>
    <div class="card">
        <h2>Bolis de Agua ($20)</h2>
        <div class="item"><span>Mango con Chamoy</span><span class="price">$20</span></div>
        <div class="item"><span>Jamaica</span><span class="price">$20</span></div>
    </div>
    <a href="https://wa.me/525580830028" class="btn">📱 Pedir por WhatsApp</a>
</body>
</html>
